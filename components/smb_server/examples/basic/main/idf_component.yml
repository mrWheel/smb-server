## Managed dependencies for the basic example (project manifest of the
## example's main component).
##
## The smb_server dependency uses Espressif's documented override_path
## pattern: in a Git checkout it resolves to the component sources at
## components/smb_server (three levels up from this main component), and when
## the example is used from the unpacked Registry component the same relative
## path resolves to that unpacked component - either way the example builds
## against the matching smb_server sources.
##
## Namespace assumption: "mrWheel" is taken from the GitHub repository URL
## (https://github.com/mrWheel/smb-server) and could not be verified against
## an ESP Component Registry account. Confirm before publication.
dependencies:
  idf:
    version: ">=6.0"
  mrWheel/smb_server:
    override_path: "../../../"
  michmich/esp-idf-wifi-provisioner:
    version: "^0.4.0"
  espressif/mdns:
    version: "^1.11.3"
  joltwallet/littlefs:
    version: "^1.22.3"
